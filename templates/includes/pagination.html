{% if is_paginated %}
  <nav class="pagination" aria-label="Сторінки каталогу">
    {% if page_obj.has_previous %}
      <a class="btn btn-outline" href="?{% if filter_query %}{{ filter_query }}&{% endif %}page={{ page_obj.previous_page_number }}" rel="prev">Назад</a>
    {% endif %}
    <span class="text-muted">Сторінка {{ page_obj.number }} з {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a class="btn btn-outline" href="?{% if filter_query %}{{ filter_query }}&{% endif %}page={{ page_obj.next_page_number }}" rel="next">Далі</a>
    {% endif %}
  </nav>
{% endif %}
