{% load static %}
<article class="product-card">
  <a href="{{ product.get_absolute_url }}" class="image-wrap">
    {% with image=product.main_image %}
      {% if image %}
        <img src="{{ image.image.url }}" alt="{{ image.alt_text|default:product.name }}" loading="lazy" width="480" height="600">
      {% else %}
        <div class="image-placeholder" aria-hidden="true">
          <span>{{ product.brand.name }}</span>
        </div>
      {% endif %}
    {% endwith %}
  </a>
  <div class="body">
    <span class="brand-name">{{ product.brand.name }}</span>
    <h3 class="product-title"><a href="{{ product.get_absolute_url }}">{{ product.name }}</a></h3>
    <span class="price">{{ product.price }} ₴</span>
    <form action="{% url 'cart:add_to_cart' product.id %}" method="post" class="card-action">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      <button type="submit" class="btn btn-outline btn-block">Додати в кошик</button>
    </form>
  </div>
</article>
