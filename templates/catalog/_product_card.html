{% load static %}
<article class="product-card">
  <a href="{{ product.get_absolute_url }}" class="image-wrap">
    {% with image=product.main_image %}
      {% if image %}
        <img src="{{ image.image.url }}" alt="{{ image.alt_text|default:product.name }}" loading="lazy">
      {% else %}
        <img src="{% static 'images/velore-logo.png' %}" alt="{{ product.name }}" loading="lazy">
      {% endif %}
    {% endwith %}
  </a>
  <div class="body">
    <span class="brand-name">{{ product.brand.name }}</span>
    <h3 style="font-size:1rem;"><a href="{{ product.get_absolute_url }}">{{ product.name }}</a></h3>
    <span class="price">{{ product.price }} ₴</span>
    <form action="{% url 'cart:add_to_cart' product.id %}" method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.path }}">
      <button type="submit" class="btn btn-outline" style="width:100%;margin-top:8px;">Додати в кошик</button>
    </form>
  </div>
</article>
